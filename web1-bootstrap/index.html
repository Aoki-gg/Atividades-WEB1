<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4"></div>
            <div class="col-md-4">2</div>
            <div class="col-md-4">3</div>
            <div class="col-md-4">
                <div id="carouselStacked" class="carousel slide">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Top controls</h5>
                        <div>
                            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked"
                                data-bs-slide="prev">
                                <span class="carousel-icon-prev" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStacked"
                                data-bs-slide="next">
                                <span class="carousel-icon-next" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                    <div class="carousel-inner rounded-5">
                        <div class="carousel-item active">
                            <img src="assets/img/python.jpg" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                            <img src="assets/img/java.jpeg" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                            <img src="assets/img/cpp.jpg" class="d-block w-100" alt="...">
                        </div>
                    </div>
                </div>



            </div>
        </div>
    </div>


    <script src="js/bootstrap.bundle.js"></script>
</body>

</html>
