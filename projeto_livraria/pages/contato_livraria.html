<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="../css/livraria.css">
</head>

<body>
    <form>
        <fieldset id="contato">
            <legend>Contate-nos</legend>

            <p>
                <label for="nome">Nome:</label>
                <input type="text" name="nome">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" name="email">
            </p>

            <p>
                <label for="telefone">Telefone:</label>
                <input type="tel" name="telefone">
            </p>

            <p>
                <label for="assunto">Assunto: </label>
                <select name="assunto">
                    <option value="Selecione">Selecione --</option>
                    <option value="Trocas">Trocas</option>
                    <option value="Atendimento">Atendimento</option>
                    <option value="Comercial">Comercial</option>
                    <option value="Outros">Outros</option>
                </select>
            </p>

            <p>
                <label for="mensagem">Mensagem:</label>
                <textarea name="mensagem" id="mensagem" rows="5" cols="50" maxlength="255"></textarea>
            </p>

            <p>
                <label for="enviarinfos">Desejo receber informações sobre a Livraria do IF?</label>
                <label for="sim">Sim</label>
                <input type="checkbox" name="sim" id="enviarinfos">
            </p>

            <p>
                <input type="submit" name="submit" id="submit">
                <button type="reset" name="reset" id="reset">Limpar</button>
            </p>


        </fieldset>
    </form>

    <a href="./livraria.html">Inicio</a>
</body>

</html>
