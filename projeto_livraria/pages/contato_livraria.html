<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="../css/livraria.css">
</head>

<body>
    <header>
        <h1>Livraria do IF</h1>
        <h2>Livros novos e usados com os melhores preços para você</h2>
    </header>

    <nav>
        <ul>
            <li><a href="./livraria.html">Livraria IF</a></li>
            <li><a href="./produtos_livraria.html">Livros</a></li>
            <li><a href="./sobre_livraria.html">Sobre</a></li>
            <li><a href="./contato_livraria.html">Contate-nos</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <form>
                <legend>Contate-nos</legend>

                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" placeholder="Digite seu nome">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" name="email" placeholder="Digite seu email">
                </p>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" name="telefone" placeholder="Digite seu telefone">
                </p>

                <p>
                    <label for="assunto">Assunto: </label>
                    <select name="assunto">
                        <option value="Selecione">Selecione --</option>
                        <option value="Trocas">Trocas</option>
                        <option value="Atendimento">Atendimento</option>
                        <option value="Comercial">Comercial</option>
                        <option value="Outros">Outros</option>
                    </select>
                </p>

                <p>
                    <label for="mensagem">Mensagem:</label>
                    <textarea name="mensagem" id="mensagem" rows="5" cols="50" maxlength="255"
                        placeholder="Qual o seu problema?"></textarea>
                </p>

                <p>
                    <label for="enviarinfos">Desejo receber informações sobre a Livraria do IF?</label>
                    <label for="sim">Sim</label>
                    <input type="checkbox" name="sim" id="enviarinfos" placeholder="Envio">
                </p>

                <p>
                    <input type="submit" name="submit" id="submit">
                    <button type="reset" name="reset" id="reset">Limpar</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>2026. Livraria IF – Todos os direitos reservados</p>
    </footer>
</body>

</html>
